name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  push:
    name: Push gem to RubyGems.org
    if: github.repository == 'tdiary/tdiary-blogkit'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    env:
      # Building and pushing the gem needs no dev/test gems.
      BUNDLE_WITHOUT: development:test
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Install libidn headers
      # idn-ruby is a runtime dependency, so BUNDLE_WITHOUT cannot skip it.
      run: sudo apt-get update && sudo apt-get -y install libidn-dev
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.4'
        bundler-cache: true
    - name: Publish to RubyGems.org
      uses: rubygems/release-gem@v1
    - name: Create GitHub Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        case "$GITHUB_REF_NAME" in
          *beta*|*rc*) PRERELEASE=--prerelease ;;
        esac
        gh release create "$GITHUB_REF_NAME" --title "tdiary-blogkit ${GITHUB_REF_NAME#v}" --generate-notes --verify-tag $PRERELEASE
